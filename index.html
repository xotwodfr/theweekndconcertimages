<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>The Weeknd - Live Concert</title>
  <style>
    body { background: #111; color: #fff; margin: 0; padding: 20px; font-family: system-ui; }
    h1 { text-align: center; font-weight: 400; margin-bottom: 24px; }
    .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); gap: 16px; }
    img { width: 100%; height: 250px; object-fit: cover; border-radius: 8px; }
  </style>
</head>
<body>
  <h1>The Weeknd - Live Concert</h1>
  <div class="grid" id="gallery"></div>
  <script>
    const gallery = document.getElementById("gallery");
    for (let i = 1; i <= 182; i++) {
      const num = String(i).padStart(2, "0");
      const img = document.createElement("img");
      img.src = `./The_Weeknd_Live_${num}.JPG`;
      img.onerror = () => {
        img.src = `./The_Weeknd_Live_${num}.jpg`;
        img.onerror = () => img.src = `./The_Weeknd_Live_${num}.PNG`;
      };
      gallery.appendChild(img);
    }
  </script>
</body>
</html>
