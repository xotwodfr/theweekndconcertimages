<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>The Weeknd - Live Concert Archive</title>
  <link rel="icon" type="image/png" href="./favicon.png">
  <style>
    :root {
      --bg: #09090b;
      --surface: #18181b;
      --surface-hover: #27272a;
      --text: #f4f4f5;
      --text-dim: #71717a;
      --accent: #fafafa;
      --border: #27272a;
    }

    * {
      box-sizing: border-box;
    }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      margin: 0;
      padding: 40px 24px;
    }

    header {
      max-width: 1600px;
      margin: 0 auto 36px auto;
      display: flex;
      justify-content: space-between;
      align-items: flex-end;
      border-bottom: 1px solid var(--border);
      padding-bottom: 20px;
    }

    .title-group h1 {
      font-size: 1.75rem;
      font-weight: 500;
      letter-spacing: -0.03em;
      margin: 0 0 6px 0;
    }

    .title-group p {
      color: var(--text-dim);
      font-size: 0.95rem;
      margin: 0;
    }

    .badge {
      background: var(--surface);
      color: var(--text-dim);
      padding: 6px 14px;
      border-radius: 20px;
      font-size: 0.85rem;
      border: 1px solid var(--border);
    }

    .grid {
      max-width: 1600px;
      margin: 0 auto;
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
      gap: 16px;
    }

    .thumb-card {
      aspect-ratio: 3 / 2;
      background: var(--surface);
      border-radius: 8px;
      overflow: hidden;
      cursor: pointer;
      position: relative;
      border: 1px solid var(--border);
      transition: transform 0.25s ease, border-color 0.25s ease, box-shadow 0.25s ease;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .thumb-card:hover {
      transform: translateY(-2px);
      border-color: #52525b;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
    }

    .thumb-card img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      opacity: 0;
      transition: opacity 0.4s ease, transform 0.4s ease;
    }

    .thumb-card img.loaded {
      opacity: 1;
    }

    .thumb-card:hover img {
      transform: scale(1.04);
    }

    .video-card-inner {
      width: 100%;
      height: 100%;
      background: linear-gradient(135deg, #18181b 0%, #09090b 100%);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 16px;
      text-align: center;
      position: relative;
    }

    .play-icon {
      width: 44px;
      height: 44px;
      background: rgba(255, 255, 255, 0.1);
      backdrop-filter: blur(4px);
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 8px;
      transition: background 0.2s, transform 0.2s;
      border: 1px solid rgba(255, 255, 255, 0.15);
    }

    .thumb-card:hover .play-icon {
      background: rgba(255, 255, 255, 0.25);
      transform: scale(1.1);
    }

    .play-icon svg {
      width: 16px;
      height: 16px;
      fill: #fff;
      margin-left: 2px;
    }

    .media-info {
      position: absolute;
      bottom: 0;
      left: 0;
      right: 0;
      padding: 10px 12px;
      background: linear-gradient(to top, rgba(0,0,0,0.9) 0%, rgba(0,0,0,0) 100%);
      color: #fff;
      font-size: 0.75rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
      opacity: 0;
      transition: opacity 0.2s ease;
    }

    .thumb-card:hover .media-info {
      opacity: 1;
    }

    .media-badge {
      background: rgba(255, 255, 255, 0.2);
      backdrop-filter: blur(4px);
      padding: 2px 6px;
      border-radius: 4px;
      font-size: 0.65rem;
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }

    .lightbox {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.96);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      display: none;
      justify-content: center;
      align-items: center;
      z-index: 99999;
      opacity: 0;
      transition: opacity 0.2s ease;
    }

    .lightbox.active {
      display: flex;
      opacity: 1;
    }

    .lightbox-content-wrap {
      position: relative;
      max-width: 92vw;
      max-height: 90vh;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .lightbox img,
    .lightbox video {
      max-width: 92vw;
      max-height: 85vh;
      object-fit: contain;
      border-radius: 4px;
      box-shadow: 0 25px 60px rgba(0, 0, 0, 0.7);
      outline: none;
    }

    .lightbox-nav {
      position: absolute;
      top: 50%;
      transform: translateY(-50%);
      background: rgba(24, 24, 27, 0.8);
      color: #fff;
      border: 1px solid rgba(255, 255, 255, 0.1);
      font-size: 1.25rem;
      width: 50px;
      height: 50px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      border-radius: 50%;
      transition: background 0.2s, transform 0.2s;
      z-index: 10;
    }

    .lightbox-nav:hover {
      background: rgba(39, 39, 42, 0.95);
      transform: translateY(-50%) scale(1.05);
    }

    .prev { left: -75px; }
    .next { right: -75px; }

    .lightbox-header {
      position: absolute;
      top: -50px;
      left: 0;
      right: 0;
      display: flex;
      justify-content: space-between;
      align-items: center;
      color: var(--text-dim);
      font-size: 0.9rem;
    }

    .lightbox-title {
      color: var(--text);
      font-weight: 500;
      max-width: 70vw;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .lightbox-close {
      background: none;
      border: none;
      color: var(--text);
      font-size: 1.75rem;
      cursor: pointer;
      padding: 0;
      line-height: 1;
      transition: color 0.2s;
    }

    .lightbox-close:hover {
      color: #fff;
    }

    @media (max-width: 768px) {
      .prev { left: 10px; }
      .next { right: 10px; }
      .lightbox-nav { width: 40px; height: 40px; font-size: 1rem; }
      body { padding: 20px 12px; }
    }
  </style>
</head>
<body>

  <header>
    <div class="title-group">
      <h1>The Weeknd — Live Concert Archive</h1>
      <p>Strawberry Arena Live Performance Gallery</p>
    </div>
    <div class="badge" id="total-badge">Loading archive...</div>
  </header>

  <div class="grid" id="gallery"></div>

  <div class="lightbox" id="lightbox">
    <div class="lightbox-content-wrap">
      <div class="lightbox-header">
        <div style="display: flex; gap: 15px; align-items: center;">
          <span id="lightbox-counter">1 / 1</span>
          <span class="lightbox-title" id="lightbox-title"></span>
        </div>
        <button class="lightbox-close" id="close-btn">&times;</button>
      </div>
      <button class="lightbox-nav prev" id="prev-btn">&#10094;</button>
      <div id="lightbox-media-container"></div>
      <button class="lightbox-nav next" id="next-btn">&#10095;</button>
    </div>
  </div>

  <script>
    const mediaItems = [
      { type: 'video', file: 'Abel talking 1 (live).MOV', title: 'Abel talking 1' },
      { type: 'video', file: 'adaptation (live).MOV', title: 'Adaptation' },
      { type: 'video', file: 'adaptation snippet (live).MOV', title: 'Adaptation snippet' },
      { type: 'video', file: 'after hours (live).MOV', title: 'After Hours' },
      { type: 'video', file: 'always be my fault (live).MOV', title: 'Always Be My Fault' },
      { type: 'video', file: 'baptized in fear x open hearts (live).MOV', title: 'Baptized In Fear x Open Hearts' },
      { type: 'video', file: 'before the concert (live).MOV', title: 'Before the Concert' },
      { type: 'video', file: 'blinding lights (live).MOV', title: 'Blinding Lights' },
      { type: 'video', file: 'call out my name (live).MOV', title: 'Call Out My Name' },
      { type: 'video', file: 'cant feel my face (live).MOV', title: 'Can\'t Feel My Face' },
      { type: 'video', file: 'carnival (live).MOV', title: 'Carnival' },
      { type: 'video', file: 'carti unknown 1 (live).MOV', title: 'Carti Unknown 1' },
      { type: 'video', file: 'carti unknown 2 (live).MOV', title: 'Carti Unknown 2' },
      { type: 'video', file: 'carti unknown 3 (live).MOV', title: 'Carti Unknown 3' },
      { type: 'video', file: 'crowd singing one of the girls (live).MOV', title: 'Crowd Singing One Of The Girls' },
      { type: 'video', file: 'cry for me (live).MOV', title: 'Cry For Me' },
      { type: 'video', file: 'ending 1 (live).MOV', title: 'Ending 1' },
      { type: 'video', file: 'ending 2 (live).MOV', title: 'Ending 2' },
      { type: 'video', file: 'ending 3 (live).MOV', title: 'Ending 3' },
      { type: 'video', file: 'faith (live).MOV', title: 'Faith' },
      { type: 'video', file: 'FE!N (live).MOV', title: 'FE!N' },
      { type: 'video', file: 'heartless (live).MOV', title: 'Heartless' },
      { type: 'video', file: 'house of balloons (live).MOV', title: 'House of Balloons' },
      { type: 'video', file: 'how do i make you love me (live).MOV', title: 'How Do I Make You Love Me' },
      { type: 'video', file: 'i feel it coming (live).MOV', title: 'I Feel It Coming' },
      { type: 'video', file: 'just screaming (live).MOV', title: 'Just Screaming' },
      { type: 'video', file: 'less than zero 1 (live).MOV', title: 'Less Than Zero 1' },
      { type: 'video', file: 'less than zero 2 (live).MOV', title: 'Less Than Zero 2' },
      { type: 'video', file: 'lost in the fire (live).MOV', title: 'Lost In The Fire' },
      { type: 'video', file: 'moth to a flame 1 (live).MOV', title: 'Moth To A Flame 1' },
      { type: 'video', file: 'moth to a flame 2 (live).MOV', title: 'Moth To A Flame 2' },
      { type: 'video', file: 'moth to a flame 3 (live).MOV', title: 'Moth To A Flame 3' },
      { type: 'video', file: 'moth to a flame 4 (live).MOV', title: 'Moth To A Flame 4' },
      { type: 'video', file: 'odd look (live).MOV', title: 'Odd Look' },
      { type: 'video', file: 'odd look snippet (live).MOV', title: 'Odd Look Snippet' },
      { type: 'video', file: 'often (live).MOV', title: 'Often' },
      { type: 'video', file: 'open hearts (live).MOV', title: 'Open Hearts' },
      { type: 'video', file: 'playboi carti song (terrible quality) (live).MOV', title: 'Playboi Carti Song' },
      { type: 'video', file: 'prince 85 (live).MOV', title: 'Prince 85' },
      { type: 'video', file: 'prince 85 song 1 (live).MOV', title: 'Prince 85 Song 1' },
      { type: 'video', file: 'prince 85 song 2 (live).MOV', title: 'Prince 85 Song 2' },
      { type: 'video', file: 'prince 85 song 3 (12-12) (live).MOV', title: 'Prince 85 Song 3' },
      { type: 'video', file: 'prince 85 song 4 (12-12) (live).MOV', title: 'Prince 85 Song 4' },
      { type: 'video', file: 'prince 85 song 5 (live).MOV', title: 'Prince 85 Song 5' },
      { type: 'video', file: 'professional x save your tears (live).MOV', title: 'Professional x Save Your Tears' },
      { type: 'video', file: 'sao paulo (live).MOV', title: 'São Paulo' },
      { type: 'video', file: 'sky (live).MOV', title: 'Sky' },
      { type: 'video', file: 'starboy (live).MOV', title: 'Starboy' },
      { type: 'video', file: 'stargirl interlude (live).MOV', title: 'Stargirl Interlude' },
      { type: 'video', file: 'the abyss (live).MOV', title: 'The Abyss' },
      { type: 'video', file: 'timeless (live).MOV', title: 'Timeless' },
      { type: 'video', file: 'type shit (live).MOV', title: 'Type Shit' },
      { type: 'video', file: 'unknown 1 (don toliver and future?) (live).MOV', title: 'Unknown Track 1' },
      { type: 'video', file: 'unknown 2 (don toliver and future?) (live).MOV', title: 'Unknown Track 2' },
      { type: 'video', file: 'wake me up x after hours (live).MOV', title: 'Wake Me Up x After Hours' },
      { type: 'video', file: 'without a warning (live).MOV', title: 'Without A Warning' }
    ];

    for (let i = 1; i <= 182; i++) {
      const num = String(i).padStart(2, '0');
      mediaItems.push({
        type: 'image',
        baseName: `The_Weeknd_Live_${num}`,
        title: `Concert Photo ${i}`
      });
    }

    const gallery = document.getElementById('gallery');
    const lightbox = document.getElementById('lightbox');
    const mediaContainer = document.getElementById('lightbox-media-container');
    const closeBtn = document.getElementById('close-btn');
    const prevBtn = document.getElementById('prev-btn');
    const nextBtn = document.getElementById('next-btn');
    const totalBadge = document.getElementById('total-badge');
    const lightboxCounter = document.getElementById('lightbox-counter');
    const lightboxTitle = document.getElementById('lightbox-title');

    let currentIndex = 0;
    const resolvedItems = new Array(mediaItems.length);
    const extensions = ['.JPG', '.jpg', '.PNG', '.png'];

    totalBadge.textContent = `${mediaItems.length} Items`;

    mediaItems.forEach((item, index) => {
      const card = document.createElement('div');
      card.className = 'thumb-card';

      if (item.type === 'video') {
        card.innerHTML = `
          <div class="video-card-inner">
            <div class="play-icon">
              <svg viewBox="0 0 24 24"><polygon points="5,3 19,12 5,21"></polygon></svg>
            </div>
            <span style="font-size: 0.8rem; color: var(--text); font-weight: 500; overflow: hidden; text-overflow: ellipsis; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical;">${item.title}</span>
          </div>
          <div class="media-info">
            <span>${item.title}</span>
            <span class="media-badge">Video</span>
          </div>
        `;
        resolvedItems[index] = { src: encodeURI(item.file), type: 'video', title: item.title };
      } else {
        const img = document.createElement('img');
        img.loading = 'lazy';
        let extIdx = 0;

        const tryExt = () => {
          if (extIdx < extensions.length) {
            img.src = `${item.baseName}${extensions[extIdx]}`;
          }
        };

        img.onload = () => {
          img.classList.add('loaded');
          resolvedItems[index] = { src: img.src, type: 'image', title: item.title };
        };

        img.onerror = () => {
          extIdx++;
          tryExt();
        };

        tryExt();

        const infoOverlay = document.createElement('div');
        infoOverlay.className = 'media-info';
        infoOverlay.innerHTML = `<span>${item.title}</span><span class="media-badge">Photo</span>`;

        card.appendChild(img);
        card.appendChild(infoOverlay);
      }

      card.addEventListener('click', () => {
        if (resolvedItems[index]) {
          openLightbox(index);
        }
      });

      gallery.appendChild(card);
    });

    function openLightbox(index) {
      currentIndex = index;
      updateLightbox();
      lightbox.classList.add('active');
      document.body.style.overflow = 'hidden';
    }

    function closeLightbox() {
      lightbox.classList.remove('active');
      mediaContainer.innerHTML = '';
      document.body.style.overflow = '';
    }

    function updateLightbox() {
      mediaContainer.innerHTML = '';
      const current = resolvedItems[currentIndex];
      
      if (current.type === 'video') {
        const vid = document.createElement('video');
        vid.controls = true;
        vid.autoplay = true;
        vid.playsInline = true;
        vid.preload = 'auto';

        const sourceMp4 = document.createElement('source');
        sourceMp4.src = current.src;
        sourceMp4.type = 'video/mp4';

        const sourceQuicktime = document.createElement('source');
        sourceQuicktime.src = current.src;
        sourceQuicktime.type = 'video/quicktime';

        vid.appendChild(sourceMp4);
        vid.appendChild(sourceQuicktime);

        mediaContainer.appendChild(vid);
      } else {
        const img = document.createElement('img');
        img.src = current.src;
        img.alt = current.title;
        mediaContainer.appendChild(img);
      }

      lightboxCounter.textContent = `${currentIndex + 1} / ${mediaItems.length}`;
      lightboxTitle.textContent = current.title;
    }

    function showPrev() {
      currentIndex = (currentIndex - 1 + mediaItems.length) % mediaItems.length;
      updateLightbox();
    }

    function showNext() {
      currentIndex = (currentIndex + 1) % mediaItems.length;
      updateLightbox();
    }

    closeBtn.addEventListener('click', closeLightbox);
    prevBtn.addEventListener('click', showPrev);
    nextBtn.addEventListener('click', showNext);

    lightbox.addEventListener('click', (e) => {
      if (e.target === lightbox) closeLightbox();
    });

    document.addEventListener('keydown', (e) => {
      if (!lightbox.classList.contains('active')) return;
      if (e.key === 'Escape') closeLightbox();
      if (e.key === 'ArrowLeft') showPrev();
      if (e.key === 'ArrowRight') showNext();
    });
  </script>
</body>
</html>
